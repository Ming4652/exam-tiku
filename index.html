<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>劳动保障监察协理员考试题库</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <h1>劳动保障监察协理员考试题库</h1>
  <p>覆盖7大劳动法规分类 · 200+道题 · 5种题型 · 1000+法条背诵</p>
</div>
<div class="nav-bar">
  <button class="nav-btn active" id="nav-home">首页</button>
  <button class="nav-btn" id="nav-category">分类练习</button>
  <button class="nav-btn" id="nav-recite">背诵模式</button>
  <button class="nav-btn" id="nav-wrongbook">错题本</button>
</div>
<div class="container page" id="page-home">
  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="total-count">-</div><div class="label">总题量</div></div>
    <div class="stat-card"><div class="num" id="total-types">5</div><div class="label">题型种类</div></div>
    <div class="stat-card"><div class="num" id="total-cats">7</div><div class="label">法规分类</div></div>
    <div class="stat-card"><div class="num" id="wrong-count">-</div><div class="label">错题数</div></div>
  </div>
  <div style="display:flex;gap:12px;margin:16px 0;flex-wrap:wrap;">
    <button class="btn btn-accent" id="btn-start-exam" style="flex:1;">模拟考试 (50题/60分钟)</button>
    <button class="btn btn-primary" id="btn-go-category" style="flex:1;">分类练习</button>
  </div>
  <div class="recite-entry-card" id="home-recite-card">
    <div class="recite-entry-left">
      <div class="recite-entry-icon">&#128214;</div>
      <div class="recite-entry-info">
        <div class="recite-entry-title">背诵模式</div>
        <div class="recite-entry-desc">法条挖空闪卡 + 艾宾浩斯遗忘曲线复习</div>
      </div>
    </div>
    <div class="recite-entry-right">
      <div class="recite-entry-stats">
        <span>已背 <strong id="recite-mastered">0</strong> 条</span>
        <span>今日待复习 <strong id="recite-today" class="recite-badge">0</strong></span>
      </div>
    </div>
  </div>
  <h3 style="margin:16px 0 8px;font-size:1.05rem;">按法规分类练习</h3>
  <div class="category-grid" id="home-categories"></div>
</div>
<div class="container page hidden" id="page-category">
  <div class="toolbar">
    <button class="btn btn-outline btn-sm" id="cat-back">← 返回首页</button>
    <h2 id="cat-title" style="font-size:1.1rem;">全部分类</h2><span></span>
  </div>
  <div>筛选题型：</div>
  <div class="type-tags" id="type-tags"></div>
  <div id="question-list"></div>
  <button class="btn btn-accent btn-block hidden" id="start-practice">开始练习</button>
</div>
<div class="container page hidden" id="page-exam">
  <div class="timer hidden" id="exam-header"><span>剩余时间：</span><span id="exam-timer">60:00</span></div>
  <div class="card" style="margin-bottom:12px;">
    <div class="progress-text" id="exam-progress-text">1/50</div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="exam-progress-bar" style="width:2%;"></div></div>
  </div>
  <div class="question-card">
    <div class="q-header"><span class="q-num" id="q-number">第 1 题</span><span class="q-type-badge badge-single" id="q-type-badge">单选题</span></div>
    <div style="font-size:0.8rem;color:var(--text-light);margin-bottom:8px;" id="q-category-info"></div>
    <div class="q-title" id="q-title"></div>
    <div class="options" id="q-options"></div>
    <div id="q-input-wrap" class="hidden"><textarea class="text-input" id="answer-input" rows="3" placeholder="请输入答案..."></textarea></div>
    <div class="explanation" id="q-explanation"></div>
  </div>
  <div style="display:flex;gap:12px;margin-top:16px;">
    <button class="btn btn-outline" id="btn-prev" style="flex:1;">上一题</button>
    <button class="btn btn-primary" id="btn-next" style="flex:1;">下一题</button>
  </div>
</div>
<div class="container page hidden" id="page-result">
  <div class="card result-card">
    <div class="result-score" id="result-score">0</div>
    <div class="result-label">正确 / <span id="result-total">0</span> 题</div>
    <div style="font-size:1.4rem;font-weight:700;color:var(--primary);" id="result-grade"></div>
    <div style="font-size:0.85rem;color:var(--text-light);margin-top:4px;">正确率：<span id="result-rate">0%</span> <span id="result-note"></span></div>
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" id="btn-retry">返回首页</button>
      <button class="btn btn-outline" id="btn-review">查看错题本</button>
    </div>
  </div>
  <h3 style="margin:16px 0;">逐题解析</h3>
  <div id="result-details"></div>
</div>
<div class="container page hidden" id="page-wrongbook">
  <h2 style="margin:12px 0;">错题本 <span style="font-size:0.9rem;color:var(--text-light);">（共 <span id="wrong-count-display">0</span> 题）</span></h2>
  <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;">
    <select id="wrong-cat-filter" style="padding:8px 12px;border:2px solid var(--border);border-radius:var(--radius);font-size:0.9rem;min-height:44px;"><option value="">全部分类</option></select>
    <button class="btn btn-outline btn-sm hidden" id="redo-wrong">重做错题</button>
    <button class="btn btn-outline btn-sm" id="clear-wrong" style="color:var(--danger);border-color:var(--danger);">清空错题本</button>
  </div>
  <div class="wrong-list" id="wrong-list"></div>
</div>
<div class="container page hidden" id="page-recite-scope">
  <div class="toolbar">
    <button class="btn btn-outline btn-sm" id="recite-scope-back">← 返回首页</button>
    <h2 style="font-size:1.1rem;">选择背诵范围</h2><span></span>
  </div>
  <div class="card">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" id="recite-select-all">全选</button>
      <button class="btn btn-outline btn-sm" id="recite-deselect-all">取消全选</button>
    </div>
    <div id="recite-category-list"></div>
  </div>
  <div style="display:flex;gap:12px;margin-top:16px;">
    <button class="btn btn-accent btn-block" id="recite-start-new">开始新背诵</button>
    <button class="btn btn-outline btn-block" id="recite-start-review" style="position:relative;">复习待背法条<span class="badge-dot hidden" id="review-badge-dot"></span></button>
  </div>
</div>
<div class="container page hidden" id="page-recite-flash">
  <div class="toolbar">
    <button class="btn btn-outline btn-sm" id="recite-flash-back">← 退出</button>
    <span id="recite-progress-text" style="font-size:0.9rem;font-weight:600;">1/50</span><span></span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="recite-progress-bar" style="width:2%;"></div></div>
  <div class="flashcard-scene" id="flashcard-scene">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-front">
        <div class="flashcard-source" id="flash-source-front"></div>
        <div class="flashcard-text" id="flash-text-front"></div>
        <div class="flashcard-hint">点击翻卡 / 滑动查看答案</div>
      </div>
      <div class="flashcard-back">
        <div class="flashcard-source" id="flash-source-back"></div>
        <div class="flashcard-text" id="flash-text-back"></div>
      </div>
    </div>
  </div>
  <div class="flashcard-actions">
    <button class="btn flash-btn flash-btn-forgot" id="btn-forgot">不记得</button>
    <button class="btn flash-btn flash-btn-remember" id="btn-remember">记住了</button>
  </div>
</div>
<div class="container page hidden" id="page-recite-round-result">
  <div class="card result-card">
    <div class="result-score" style="color:var(--success);" id="round-remember-count">0</div>
    <div class="result-label">记住 / <span id="round-total-count">0</span> 条</div>
    <div class="result-stats">
      <div class="result-stat"><div class="val" style="color:var(--danger);" id="round-forgot-count">0</div><div class="label">不记得</div></div>
      <div class="result-stat"><div class="val" id="round-rate">0%</div><div class="label">掌握率</div></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn btn-primary" id="round-retry-forgot">重背不记得的</button>
      <button class="btn btn-outline" id="round-back-home">返回首页</button>
      <button class="btn btn-outline" id="round-view-stats">查看统计</button>
    </div>
  </div>
</div>
<div class="container page hidden" id="page-recite-stats">
  <div class="toolbar">
    <button class="btn btn-outline btn-sm" id="recite-stats-back">← 返回</button>
    <h2 style="font-size:1.1rem;">背诵统计</h2><span></span>
  </div>
  <div class="card" style="text-align:center;">
    <div style="font-size:2rem;font-weight:700;color:var(--primary);" id="stats-days">0</div><div style="color:var(--text-light);">坚持天数</div>
  </div>
  <div class="stats-grid" style="grid-template-columns: repeat(3,1fr);">
    <div class="stat-card"><div class="num" id="stats-total-laws">0</div><div class="label">法条总数</div></div>
    <div class="stat-card"><div class="num" style="color:var(--success);" id="stats-mastered">0</div><div class="label">已掌握</div></div>
    <div class="stat-card"><div class="num" style="color:var(--accent);" id="stats-mastery-rate">0%</div><div class="label">掌握率</div></div>
  </div>
  <h3 style="margin:16px 0 8px;">分类进度</h3>
  <div id="recite-cat-progress"></div>
</div>
<div class="bottom-nav">
  <button class="nav-item active" id="bn-home"><span class="icon">&#8962;</span>首页</button>
  <button class="nav-item" id="bn-category"><span class="icon">&#9776;</span>分类练习</button>
  <button class="nav-item" id="bn-recite"><span class="icon">&#128214;</span>背诵</button>
  <button class="nav-item" id="bn-wrongbook"><span class="icon">&#10006;</span>错题本</button>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
